# FINAL C2 campaign #5 registry SPEC (pre-registered 2026-11-23, before the registry was frozen).
# Primary = best.pt (source-validation selection); secondary = last.pt (final step 3000) of the same completed run.
# Arms: Z official; R raw SimCol (seeds 0,1); A_mild photometric jitter; A_strong strong jitter (one image per ID);
# T Reinhard Lab transfer to a random C1-train frame; S same generator with the SOURCE look (source LoRA + Control-LoRA);
# G Control-LoRA target look (seeds 0,1); Gp G with a new generation seed; M 50/50 raw/G mixture;
# R_bb / G_bb LoRA on the last 4 DA3 ViT blocks + head. Continuity (best only, reported in campaigns 2-3):
# G_full / M_full full ControlNet controller, G_simuscope SimuScope-style img2img baseline.
