[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-sim2real"
version = "0.1.0"
description = "Depth-controlled appearance adaptation for endoscopic sim-to-phantom transfer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.4.6",
    "opencv-python-headless==5.0.0.93",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "scipy==1.17.1",
    "torch==2.13.0",
    "tqdm==4.67.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
